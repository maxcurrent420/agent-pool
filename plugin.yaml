name: agent-pool
version: 2.3.0
description: Agent Pool — friends form an agent team; repos propagate via Iroh, coordination only via the gateway
manifest_version: 2
api_version: 1
license: MIT
tags: [gateway, discord, iroh, team]
requires_hermes: ">=0.22.0"
python_dependencies:
  - "pynacl>=1.5,<2"
  - "blake3>=0.4,<2"
provides_tools:
  - pool_status
provides_hooks:
  - gateway_platform_event
config_schema:
  relay_url:
    type: str
    default: ""
    description: "Iroh relay URL (empty = default n0 relay). An explicit non-empty value beats the HERMES_IROH_RELAY env var; empty means unset (env still applies). 'off'/'none'/'disabled' is rejected in every mode (transfers are always relay-only; there is no direct mode). Point both ends at a self-hosted/trusted relay here (global or per-pool) for a stronger anonymity layer"
  transport_mode:
    type: str
    default: "relay"
    description: "Repo-byte transport privacy. Fixed to 'relay': transfers are always relay-only on BOTH sender and receiver (relay-only ticket + relay-only endpoint policy, so the peer learns no IP; the relay still sees both peers' IPs + metadata, never plaintext). There is no direct mode and no way to opt into one; 'direct' or any other value is rejected. The key exists only for forward-compatibility with 'tor' (unavailable on this host: fails closed with instructions to use relay). Per-pool: pools.<pool_id>.transport_mode/_relay_url overrides this. HERMES_IROH_RELAY=off is a no-op in every mode."
  max_turns:
    type: int
    default: 25
    description: "Per-claim budget: max agent turns"
  max_tasks_per_day:
    type: int
    default: 5
    description: "Per-claim budget: max tasks per day per worker"
  token_cap:
    type: int
    default: 50000
    description: "Per-claim budget: token cap"
  wall_clock_seconds:
    type: int
    default: 1800
    description: "Per-claim budget: wall-clock limit in seconds"
  pools:
    type: dict
    default: {}
    description: "Per-pool settings keyed by pool_id (budgets, relay overrides)"
  transport:
    type: str
    default: "real"
    description: "Bundle transport: real (send_hermes/Iroh) or fake (in-memory, tests/CLI)"
