name: agent-pool
version: "2.8.0"
description: >-
  Agent Pool — friends form an agent team; repos propagate via Iroh-over-Tor
  only (Iroh + Tor custom transport via the tor-enabled send_hermes sidecar;
  Tor-mandatory, no relay fallback, fails closed at first use / byte
  transfer, never at plugin registration). Python deps are declared in
  pyproject.toml and installed by Hermes (hermes plugins validate
  --install-deps / hermes pm install); system services (ClamAV, Tor
  daemon, tor-enabled sidecar) are provisioned by the documented
  first-run bootstrap scripts/install-deps.sh. Coordination only via the Hermes
  gateway: 3 tools (pool_status, pool_report_usage, pool_pane_report) and 10 slash commands
  (pool, fetch, task, add-repo, task_add, task_list, claim, release, push,
  audit — see provides_commands). Disclosure: spawns git/bubblewrap/send_hermes
  child processes; network calls go to Iroh peers over Tor (no relay in the
  connection path; HERMES_IROH_RELAY is ignored); stores its own ed25519/box
  keypairs and ledger under the profile plugin-data dir; no telemetry, no
  stored credentials beyond its own keypairs.
manifest_version: 2
api_version: 1
license: MIT
tags: [gateway, discord, iroh, team]
requires_hermes: ">=0.23.0"
python_dependencies:
  - "pynacl>=1.5,<2"
  - "blake3>=0.4,<2"
requires_env:
  - AGENT_POOL_ALLOWED_USERS
  - AGENT_POOL_MAINTAINER_DISCORD_USER_ID
  - AGENT_POOL_MAINTAINER_BOT_DISCORD_USER_ID
  - AGENT_POOL_TASK_ALLOCATIONS
  - AGENT_POOL_WORKTREE_ROOT
  - AGENT_POOL_DATA_DIR
  - HERMES_IROH_RELAY
  - HERMES_IROH_STATE_DIR
  - HERMES_IROH_SEND_TIMEOUT
  - HERMES_IROH_FETCH_TIMEOUT
provides_tools:
  - pool_status
  - pool_report_usage
  - pool_pane_report
provides_commands:
  - pool
  - fetch
  - task
  - add-repo
  - task_add
  - task_list
  - claim
  - release
  - push
  - audit
provides_hooks: []
config_schema:
  relay_url:
    type: str
    default: ""
    description: "Deprecated and ignored: Iroh-over-Tor is the only byte transport and no relay flags are ever emitted, so a relay URL has no effect. Retained only so legacy config does not error; remove it."
  transport_mode:
    type: str
    default: "tor"
    description: "Repo-byte transport: 'tor' only — Iroh Tor custom transport via the tor-enabled send_hermes sidecar (option (A), scripts/install-tor.sh); connection paths are onion-routed, neither peer learns the other's IP, and there is no relay in the connection path. Both endpoints must enable Tor; the tor_ready() probe is a hard gate at service construction (lazy, first use) and before every transfer and fails closed (systemctl start agent-pool-tor) — plugin registration itself is pure wiring and never probes Tor; there is no relay fallback and no relay option. Any other value, including legacy 'relay' at the transport layer, is rejected; a legacy top-level transport_mode=relay in plugin config is ignored (treated as tor) with a migration warning in pool_status. Fork the source to change the transport. HERMES_IROH_RELAY is ignored."
  tor_control_port:
    type: int
    default: 9051
    description: "Tor control port (127.0.0.1 only, CookieAuthentication 0, ops/torrc). Probed by tor_ready() at service construction (lazy, first use) and before every transfer; failure names 'systemctl start agent-pool-tor' and fails closed. Never probed at plugin registration."
  tor_socks_port:
    type: int
    default: 9055
    description: "Tor SOCKS port (127.0.0.1 only) for operator tooling; the Iroh Tor transport manages its own circuits via the control port."
  tor_binary:
    type: str
    default: ""
    description: "Tor sidecar binary path (option (B): standalone agent-pool-iroh). Empty = tor-enabled send_hermes on PATH (option (A), the chosen default). When empty, resolution prefers a tor-enabled send_hermes-tor build over the stock send_hermes; the stock binary is used only when it advertises the tor transport flag. Build/refresh with scripts/install-tor.sh or the system bootstrap scripts/install-deps.sh."
  clamd_socket:
    type: str
    default: "/run/clamav/clamd.ctl"
    description: "Unix socket path of the ClamAV daemon (clamd) used by the mandatory ingestion scan (clamav_scan). When the daemon socket is unreachable the plugin falls back to the real clamscan binary; a missing engine fails the audit closed (never a keyword-only verdict)."
  auto_provision:
    type: bool
    default: true
    description: "When true, a missing ClamAV engine at audit time triggers one lockfile-guarded attempt at the system steps of scripts/install-deps.sh (--system-only) under the plugin data dir, then re-probes; still absent fails closed. When false, a missing engine fails the audit closed immediately."
  max_turns:
    type: int
    default: 25
    description: "Optional secondary limit: max agent turns, enforced only when the agent reports usage via the pool_report_usage tool; there is no pool-level budget."
  max_tasks_per_day:
    type: int
    default: 5
    description: "Default per-agent task allocation: how many tasks an agent may COMPLETE on the pool. Overridden per agent by agent_task_allocations (and env AGENT_POOL_TASK_ALLOCATIONS, which beats config); never a pool-level budget."
  agent_task_allocations:
    type: dict
    default: {}
    description: "Per-agent task-count budget on the pool (key_id -> int): the maximum number of tasks the agent may COMPLETE. Once an agent's completed-task count reaches its allocation, further claims and pushes for that agent are refused. Precedence: AGENT_POOL_TASK_ALLOCATIONS env (comma-separated key_id=N pairs) > this config > max_tasks_per_day > 5. No pool-level budget and no slash command for allocations."
  token_cap:
    type: int
    default: 50000
    description: "Optional secondary limit: token cap, enforced only when the agent reports usage via the pool_report_usage tool; there is no pool-level budget."
  wall_clock_seconds:
    type: int
    default: 1800
    description: "Optional secondary limit: wall-clock limit in seconds, enforced only when the agent reports usage via the pool_report_usage tool; there is no pool-level budget."
  pools:
    type: dict
    default: {}
    description: "Deprecated and ignored: per-pool transport settings have no effect — Iroh-over-Tor is the only transport for every pool. Legacy transport_mode=relay entries are ignored with a migration warning; remove them."
  allowed_users:
    type: list
    default: []
    description: "Discord user ids allowed on the hosted pool (whitelist). Env AGENT_POOL_ALLOWED_USERS (comma-separated) wins over this config when both are set; the pool owner (from maintainer_discord_user_id config/env) is always whitelisted. Empty = owner only."
  maintainer_discord_user_id:
    type: str
    default: ""
    description: "Discord user id of the pool maintainer/owner for the gateway's hosted pool. Required to register a pool; used as the owner on /pool register. Env AGENT_POOL_MAINTAINER_DISCORD_USER_ID (or reuse of the gateway allowlist's single owner) wins when set."
  maintainer_bot_discord_user_id:
    type: str
    default: ""
    description: "Discord user id of the maintainer gateway BOT itself (the bot account that runs the pool). Required to register a pool: at registration BOTH this bot id and maintainer_discord_user_id are bound to the gateway (maintainer) key in pool_memberships — the only two identities that ever resolve to the gateway key. Env AGENT_POOL_MAINTAINER_BOT_DISCORD_USER_ID wins when set."
  transport:
    type: str
    default: "real"
    description: "Bundle transport: real (send_hermes/Iroh over Tor, gated by tor_ready() at first use) or fake (in-memory, tests/CLI only; exempt from the tor gate)"
