name: agent-pool
version: 2.6.0
description: Agent Pool — friends form an agent team; repos propagate via Iroh, coordination only via the gateway
manifest_version: 2
api_version: 1
license: MIT
tags: [gateway, discord, iroh, team]
requires_hermes: ">=0.22.0"
python_dependencies:
  - "pynacl>=1.5,<2"
  - "blake3>=0.4,<2"
provides_tools:
  - pool_status
  - pool_report_usage
provides_hooks: []
config_schema:
  relay_url:
    type: str
    default: ""
    description: "Iroh relay URL (empty = default n0 relay). An explicit non-empty value beats the HERMES_IROH_RELAY env var; empty means unset (env still applies). 'off'/'none'/'disabled' is rejected in every mode (transfers are always relay-only; there is no direct mode). Point both ends at a self-hosted/trusted relay here (global or per-pool) for a stronger anonymity layer"
  transport_mode:
    type: str
    default: "relay"
    description: "Repo-byte transport privacy. 'relay': transfers are always relay-only on BOTH sender and receiver (relay-only ticket + relay-only endpoint policy, so the peer learns no IP; the relay still sees both peers' IPs + metadata, never plaintext). This is the explicit fallback mode. 'tor' (opt-in): Iroh Tor custom transport via the tor-enabled send_hermes sidecar (option (A), scripts/install-tor.sh) — connection paths onion-routed, neither peer learns the other's IP, no relay in the connection path. Both endpoints must enable Tor; tor-ready probe fails closed (systemctl start agent-pool-tor) and never falls back to relay. There is no direct mode and no way to opt into one; 'direct' or any other value is rejected. Per-pool: pools.<pool_id>.transport_mode/_relay_url overrides this. HERMES_IROH_RELAY=off is a no-op in relay mode and irrelevant in tor mode (no relay flags are emitted)."
  tor_control_port:
    type: int
    default: 9051
    description: "Tor control port (127.0.0.1 only, CookieAuthentication 0, ops/torrc). Probed by tor_ready() before every tor-mode transfer; failure names 'systemctl start agent-pool-tor' and fails closed."
  tor_socks_port:
    type: int
    default: 9055
    description: "Tor SOCKS port (127.0.0.1 only) for operator tooling; the Iroh Tor transport manages its own circuits via the control port."
  tor_binary:
    type: str
    default: ""
    description: "Tor sidecar binary path (option (B): standalone agent-pool-iroh). Empty = tor-enabled send_hermes on PATH (option (A), the chosen default)."
  max_turns:
    type: int
    default: 25
    description: "Per-claim budget: max agent turns"
  max_tasks_per_day:
    type: int
    default: 5
    description: "Per-claim budget: max tasks per day per worker"
  agent_task_allocations:
    type: dict
    default: {}
    description: "Per-agent task-count budget on the pool (key_id -> int): the maximum number of tasks the agent may COMPLETE. Once an agent's completed-task count reaches its allocation, further claims and pushes for that agent are refused. Precedence: AGENT_POOL_TASK_ALLOCATIONS env (comma-separated key_id=N pairs) > this config > max_tasks_per_day > 5. No pool-level budget and no slash command for allocations."
  token_cap:
    type: int
    default: 50000
    description: "Per-claim budget: token cap"
  wall_clock_seconds:
    type: int
    default: 1800
    description: "Per-claim budget: wall-clock limit in seconds"
  pools:
    type: dict
    default: {}
    description: "Per-pool settings keyed by pool_id (transport_mode, relay_url only)"
  allowed_users:
    type: list
    default: []
    description: "Discord user ids allowed on the hosted pool (whitelist). Env AGENT_POOL_ALLOWED_USERS (comma-separated) wins over this config when both are set; the pool owner (register --discord-user) is always whitelisted. Empty = owner only."
  transport:
    type: str
    default: "real"
    description: "Bundle transport: real (send_hermes/Iroh) or fake (in-memory, tests/CLI)"
